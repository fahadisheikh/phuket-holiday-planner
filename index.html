function exploreCard(a){const count=state.experiences.filter(x=>x.ref===a.id).length,done=a.historicalDone||count>0;return `<article class="item"><div class="row" style="align-items:flex-start">${picture(a)}<div class="grow card-body"><div><div class="event-title">${E(a.displayName||a.title)}</div><div class="tiny muted">${E(a.region||a.shop||'Location unconfirmed')}</div></div><div class="small readable muted">${E((a.description||a.notes||'').slice(0,135))}</div><div class="pill-row"><span class="chip ${done?'good':''}">${done?`${a.kind==='do'?'Visited':a.kind==='try'?'Tried':'Bought'} ${count||''}`:'Not yet'}</span>${a.starred?'<span class="chip">⭐ Favourite</span>':''}</div></div></div><div class="actions"><button class="btn sm primary" data-action="add" data-id="${E(a.id)}">+ Add to Day</button><button class="btn sm" data-action="details" data-id="${E(a.id)}">Details</button><button class="btn sm" data-action="record" data-id="${E(a.id)}">${a.kind==='try'?'Tried':a.kind==='buy'?'Bought':'Visited'}</button><button class="btn sm" data-action="star" data-id="${E(a.id)}" aria-label="Toggle favourite">${a.starred?'★':'☆'}</button></div></article>`}
function diaryScreen(){return `<div class="stack">${dateNav()}<section class="panel stack"><div class="row between"><div><div class="label">Holiday diary</div><h2>${dateTitle(day)}</h2></div><button class="btn" data-action="diaryNote">Add note / photo</button></div>${dayDiary(day)}<div class="row wrap"><button class="btn primary" data-action="newExperience">+ Record experience</button><button class="btn" data-action="newExpense">+ Expense</button></div></section><section class="panel stack"><h3>All days</h3>${DATES.map(d=>`<div class="mini row between"><div><b>${E(dateTitle(d))}</b><div class="tiny muted">${state.experiences.filter(x=>x.date===d).length} experiences · ${(state.diary[d]?.photos||[]).length} photos</div></div><button class="btn sm" data-day="${d}" data-view="diary">View</button></div>`).join('')}</section></div>`}
function dayDiary(d){const ex=state.experiences.filter(x=>x.date===d).sort((a,b)=>(a.time||'').localeCompare(b.time||''));const notes=state.diary[d]||{note:'',photos:[]};const spend=state.spends.filter(x=>x.date===d);return `<div class="stack">${ex.map(x=>{const a=catalogItem(x.ref),n=a?.displayName||a?.title||x.title||'Experience';return `<div class="mini stack"><div class="row between"><div><b>${E(n)}</b><div class="small muted">${E(x.location||a?.shop||a?.region||'')} · ${E(x.time||'Time not recorded')}</div></div><button class="btn sm" data-action="editExperience" data-id="${x.id}">Edit</button></div>${x.rating?`<span class="chip good">${E(x.rating)}</span>`:''}${x.note?`<p class="note">${E(x.note)}</p>`:''}${x.photos?.length?`<div class="photo-row">${x.photos.map(p=>photoImg(p)).join('')}</div>`:''}</div>`}).join('')||'<p class="muted">No experiences recorded for this date yet.</p>'}${notes.note?`<div class="mini note">${E(notes.note)}</div>`:''}${notes.photos?.length?`<div class="photo-row">${notes.photos.map(p=>photoImg(p)).join('')}</div>`:''}${spend.length?`<div class="mini stack"><b>Recorded transactions</b>${spend.map(x=>`<div class="row between small"><span>${E(x.title||x.category)}</span><span>${x.kind==='refund'?'-':''}${money(x.price,x.currency)}</span></div>`).join('')}</div>`:''}</div>`}
function photoImg(pid){return photosURL[pid]?`<img class="photo" alt="Holiday memory" src="${photosURL[pid]}">`:`<div class="photo picture-fallback" title="Photo stored on this device">📷</div>`}
function render(){document.title='Phuket Holiday Planner V5';$('nav').innerHTML=nav();$('app').innerHTML=(loadError?'<div class="warning"><b>Could not safely read saved planner data.</b> Previous V4 browser data was not deleted. Avoid editing this copy until you restore a verified backup.</div>':'')+(view==='today'?todayScreen():view==='holiday'?holidayScreen():view==='explore'?exploreScreen():diaryScreen());$('quickExpense').classList.toggle('hidden',view==='holiday'&&false)}
function modal(title,html,onSave,saveLabel='Save'){modalFn=onSave;const d=$('editor');if(d.open)d.close();d.innerHTML=`<div class="inner stack"><div class="row between"><h2>${E(title)}</h2><button class="btn sm" data-action="close" aria-label="Close">✕</button></div>${html}</div><div class="foot"><button class="btn" data-action="close">Cancel</button><button class="btn primary" id="modalSave">${E(saveLabel)}</button></div>`;d.showModal()}
function closeModal(){const d=$('editor');if(d.open)d.close();modalFn=null}
function field(name,label,value='',type='text',extra=''){return `<div class="field"><label for="${E(name)}">${E(label)}</label><input id="${E(name)}" type="${E(type)}" value="${E(value)}" ${extra}></div>`}
function select(name,label,opts,val){return `<div class="field"><label for="${E(name)}">${E(label)}</label><select id="${E(name)}">${opts.map(([k,v])=>`<option value="${E(k)}" ${k===val?'selected':''}>${E(v)}</option>`).join('')}</select></div>`}
function currSelect(n,c='THB'){return select(n,'Currency',['THB','QAR','USD'].map(x=>[x,x]),c)}
function dateSelect(n,d=day){return select(n,'Date',DATES.map(x=>[x,dateTitle(x)]),d)}
function textArea(n,label,value=''){return `<div class="field"><label for="${E(n)}">${E(label)}</label><textarea id="${E(n)}">${E(value)}</textarea></div>`}
function v(n){return $(n)?.value??''}
function details(ref){const a=catalogItem(ref);if(!a)return;const history=state.experiences.filter(x=>x.ref===ref);modal(a.displayName||a.title,`<div class="hero">${picture(a)}<div class="grow stack"><div class="small muted">${a.kind==='try'?'Thing to Try':a.kind==='buy'?'Thing to Buy':'Activity'} · ${E(a.region||a.shop||'Location unknown')}</div><div class="pill-row"><span class="chip">${E(a.weather||(a.kind==='try'?'Food':'Shopping'))}</span><span class="chip">Experienced ${history.length} time(s)</span></div></div></div><div class="note readable">${E(a.description||a.notes||'')}</div>${a.recognise?`<div class="mini"><b>How to recognise it</b><p class="small note">${E(a.recognise)}</p></div>`:''}<div class="mini"><b>Where to look</b><p class="small">${E(a.region||a.shop||'No specific venue confirmed.')} ${a.kind!=='do'?'Availability is not confirmed at individual shops.':''}</p></div>${field('imageLink','Reference image URL (optional)',a.imageUrl||'','url')}${field('aShop','Shop / typical place',a.shop||'')}${field('aRegion','Area',a.region||'')}${textArea('aDesc','Description',a.description||'')}${textArea('aTip','Recognition tip',a.recognise||'')}<div class="row wrap"><button class="btn sm" data-action="lookupPhoto" data-id="${a.id}">Find Wikimedia reference photo</button><button class="btn sm" data-action="record" data-id="${a.id}">Record experience</button><button class="btn sm" data-action="add" data-id="${a.id}">+ Add to Day</button></div><p class="help">Use verified photos only. New online image results may not always depict the exact brand or vendor.</p>`,()=>{a.imageUrl=v('imageLink').trim();a.shop=v('aShop').trim();a.region=v('aRegion').trim();a.description=v('aDesc').trim();a.recognise=v('aTip').trim();save();render();notify('Details saved')})}
async function lookupPhoto(ref){const a=catalogItem(ref);if(!a)return;try{notify('Searching for a reference image…');const term=a.displayName||a.title;const u=new URL('https://commons.wikimedia.org/w/api.php');u.searchParams.set('action','query');u.searchParams.set('generator','search');u.searchParams.set('gsrsearch',`${term} ${a.kind==='try'?'Thai dessert':''} filetype:bitmap`);u.searchParams.set('gsrnamespace','6');u.searchParams.set('gsrlimit','6');u.searchParams.set('prop','imageinfo');u.searchParams.set('iiprop','url|extmetadata');u.searchParams.set('iiurlwidth','420');u.searchParams.set('format','json');u.searchParams.set('origin','*');const r=await fetch(u,{signal:AbortSignal.timeout(9000)});if(!r.ok)throw Error('Image search unavailable');const j=await r.json(),files=Object.values(j.query?.pages||{}).filter(x=>x.imageinfo?.[0]?.thumburl);if(!files.length)throw Error('No suitable results');closeModal();modal('Select a reference photo',`<p class="small muted">Check that the photo actually depicts ${E(term)} before selecting it. Images are from Wikimedia Commons; usage may require attribution. These results are not a claim about local availability.</p><div class="grid">${files.map((f,i)=>`<div class="mini stack"><img style="width:100%;height:140px;object-fit:contain" src="${E(f.imageinfo[0].thumburl)}" alt="${E(f.title)}"><div class="tiny">${E(f.title)}</div><button class="btn sm" data-action="usePhoto" data-id="${E(ref)}" data-url="${E(f.imageinfo[0].thumburl)}">Use photo</button></div>`).join('')}</div>`,()=>{}); }catch(e){notify('Reference photo search unavailable; add a URL manually if you have one.')}}
function record(ref,eventId=null){const a=catalogItem(ref);if(!a)return;const rec={id:id(),ref,date:day,location:a.shop||a.region||'',time:new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Bangkok',hour:'2-digit',minute:'2-digit',hour12:false}).format(new Date()),rating:'',note:'',photos:[],eventId};update(()=>{state.experiences.push(rec);if(eventId){const e=allEvents().find(x=>x.id===eventId);if(e){const orig=state.plans[e.__mode][e.__day].find(z=>z.id===eventId);orig.outcome='yes'}}});notify('Experience recorded. Add a memory anytime.');return rec}
function expEdit(x){modal('Experience details',`${dateSelect('exDate',x.date)}${field('exLocation','Place / shop',x.location||'')}${select('exRating','How was it?',[['','No rating'],['Loved it','❤️ Loved it'],['It was OK','🙂 It was OK'],['Not for me','🙃 Not for me']],x.rating||'')}${textArea('exNote','Memory or note',x.note||'')}<div class="row wrap"><button class="btn" data-action="uploadPhoto" data-target="experience" data-id="${x.id}">📷 Add photo</button><button class="btn danger" data-action="deleteExperience" data-id="${x.id}">Delete record</button></div><div class="photo-row">${(x.photos||[]).map(pid=>photoImg(pid)).join('')}</div>`,()=>{x.date=v('exDate');x.location=v('exLocation');x.rating=v('exRating');x.note=v('exNote');save();render()})}
function dayPlanNoteEdit(){modal('Day planning notes',textArea('planText','Planning notes for '+dateTitle(day),state.dayNotes[day]||''),()=>{state.dayNotes[day]=v('planText');save();render()})}
function diaryEdit(){const obj=state.diary[day];modal('Day memories · '+dateTitle(day),`${textArea('diaryText','Notes and favourite moments',obj.note||'')}<button class="btn" data-action="uploadPhoto" data-target="day" data-id="${day}">📷 Add photo</button><div class="photo-row">${obj.photos.map(photoImg).join('')}</div><div class="small muted">Your personal photos stay in this browser and are included in downloaded backups.</div>`,()=>{obj.note=v('diaryText');save();render()})}
function expenseModal(kind='expense',old=null,eventId=null){const e=eventId?allEvents().find(x=>x.id===eventId):null;const a=e?catalogItem(e.ref):null;const cats=[...new Set([...state.categories,...state.spends.map(x=>x.category).filter(Boolean)])];const d=old?.date||day,pool=old?.pool||(eventId?'none':poolType(old?.category||'Food & Drinks'));modal(kind==='refund'?'Refund received':'Record expense',`${field('exAmount','Amount',old?.price??(e&&isNum(estimate(e))?Math.round(fromQAR(Math.max(0,estimate(e)-eventPay(e)),'THB')):''),'number','min="0" step="any" required')}${currSelect('exCurr',old?.currency||'THB')}${dateSelect('exDate',d)}${field('exTitle','Description',old?.title||a?.title||'')}${field('exCategory','Category (type or choose)',old?.category|| (kind==='refund'?'Refund':eventId?'Activities':'Food & Drinks'),'text','list="catList"')}<datalist id="catList">${cats.map(c=>`<option value="${E(c)}"></option>`).join('')}</datalist>${kind==='refund'?'':select('pool','Count against allowance (optional)',[['none','No allowance'],...state.reserves.map(r=>[r.category,r.title])].filter((x,i,all)=>all.findIndex(y=>y[0]===x[0])===i),pool)}<p class="help">${kind==='refund'?'Only money actually received is recorded. Cancelling an activity never creates a refund.':eventId?'This payment will reduce the remaining estimate for this activity, without counting it twice.':'One transaction is counted once. Experiences and meals are recorded separately.'}</p>`,()=>{const price=Number(v('exAmount'));if(!Number.isFinite(price)||price<0||v('exAmount').trim()==='')throw Error('Enter a valid non-negative amount');const cat=v('exCategory').trim()||'Other';const up={title:v('exTitle').trim()||cat,price,currency:v('exCurr'),date:v('exDate'),category:cat,pool:kind==='refund'?'none':v('pool'),kind,eventId:eventId||old?.eventId||null};if(old)Object.assign(old,up);else state.spends.push({id:id(),...up});if(!state.categories.some(x=>k(x)===k(cat)))state.categories.push(cat);save();render();notify(kind==='refund'?'Refund recorded':'Expense saved')},kind==='refund'?'Record refund':'Save expense')}
function expensesList(){modal('Expenses & refunds',`<div class="row wrap"><button class="btn primary" data-action="newExpense">+ Expense</button><button class="btn" data-action="newRefund">+ Refund received</button></div>${state.spends.length?`<div class="stack">${[...state.spends].sort((a,b)=>b.date.localeCompare(a.date)).map(x=>`<div class="mini row between"><div><b>${E(x.title)}</b><div class="small muted">${E(x.date)} · ${E(x.category)} ${x.kind==='refund'?'· Refund':''}</div></div><div><b>${x.kind==='refund'?'-':''}${money(x.price,x.currency)}</b><div><button class="btn sm" data-action="editSpend" data-id="${x.id}">Edit</button><button class="btn sm danger" data-action="deleteSpend" data-id="${x.id}">Delete</button></div></div></div>`).join('')}</div>`:'<p class="muted">No expenses recorded yet.</p>'}`,()=>{})}
function allowanceList(){modal('Holiday allowances',`<p class="small muted">These amounts are planned until actual expenses consume them. They never count as already paid.</p><div class="stack">${state.reserves.map(x=>`<div class="mini row between"><div><b>${E(x.title)}</b><div class="small muted">${E(x.category)}</div></div><div><b>${money(x.price,x.currency)}</b><button class="btn sm" data-action="editReserve" data-id="${x.id}">Edit</button></div></div>`).join('')}</div>`,()=>{})}
function fixedList(){modal('Fixed holiday costs',`<div class="stack">${state.fixed.map(x=>`<div class="mini row between"><div><b>${E(x.title)}</b><div class="small muted">${x.paid?'Paid':'Not paid'}</div></div><div><b>${isNum(x.price)?money(x.price,x.currency):'Add cost'}</b><button class="btn sm" data-action="editFixed" data-id="${x.id}">Edit</button></div></div>`).join('')}</div>`,()=>{})}
function budgetSettings(){modal('Budget & exchange rates',`${field('totalBudget','Total holiday budget (QAR)',state.budget,'number','min="0" step="any"')}${['QAR','USD','THB'].map(c=>field('rate_'+c,`Units of ${c} per USD`,state.rates[c],'number','min="0.00001" step="any"')).join('')}<p class="help">Historical expenses retain the original currency amount. Converted display values use these configurable rates.</p>`,()=>{const amount=Number(v('totalBudget'));if(!Number.isFinite(amount)||amount<0)throw Error('Invalid budget');const rates={...state.rates};for(const c of ['QAR','USD','THB']){const n=Number(v('rate_'+c));if(n<=0||!Number.isFinite(n))throw Error('Invalid exchange rate');rates[c]=n}state.budget=amount;state.rates=rates;save();render()})}
function reserveEdit(x){modal('Adjust allowance',`${field('allowanceAmount',x.title+' ('+x.currency+')',x.price,'number','min="0" step="any"')}`,()=>{const p=Number(v('allowanceAmount'));if(p<0||!Number.isFinite(p))throw Error('Enter a valid amount');x.price=p;save();render()})}
function fixedEdit(x){modal('Fixed cost',`${field('fixedPrice',x.title+' — amount',x.price??'','number','min="0" step="any"')}${currSelect('fixedCurr',x.currency)}<label class="toggle"><input id="fixedPaid" type="checkbox" ${x.paid?'checked':''}>Already paid</label>`,()=>{const raw=v('fixedPrice');if(raw!==''&&(!Number.isFinite(Number(raw))||Number(raw)<0))throw Error('Invalid cost');x.price=raw===''?null:Number(raw);x.currency=v('fixedCurr');x.paid=$('fixedPaid').checked;save();render()})}
function eventEdit(e){const a=catalogItem(e.ref);modal('Edit activity',`<h3>${E(a?.displayName||a?.title||'Experience')}</h3>${field('evtTime','Start time',e.time||'12:00','time')}${field('evtDuration','Duration (minutes)',e.duration||knownDuration(a),'number','min="5" step="5"')}<label class="toggle"><input id="evtLocked" type="checkbox" ${e.locked?'checked':''}>🔒 Lock this time</label>${field('evtPrice','Estimated total cost',e.overridePrice??a?.price??'','number','min="0" step="any"')}${currSelect('evtCurr',e.overrideCurrency||a?.currency||'THB')}${textArea('evtNote','Notes',e.note||'')}<button class="btn danger" data-action="removeEvent" data-id="${e.id}">Remove from this plan</button>`,()=>{e.time=v('evtTime');e.duration=Math.max(5,num(v('evtDuration'))||knownDuration(a));e.locked=$('evtLocked').checked;const raw=v('evtPrice');e.overridePrice=raw===''?null:Math.max(0,num(raw));e.overrideCurrency=v('evtCurr');e.note=v('evtNote');save();render()})}
function outcomeEdit(e){modal('Did this activity happen?',`<h3>${E(catalogItem(e.ref)?.title||'Activity')}</h3><div class="seg">${[['yes','✓ Yes'],['no','✕ No'],['later','Later']].map(([v,l])=>`<button data-outcome="${v}" data-id="${e.id}" class="${(e.outcome||'later')===v?'selected':''}">${l}</button>`).join('')}</div><p class="help">Completion is separate from payment. No automatic refunds or expenses.</p>`,()=>{})}
function moveEdit(e){modal('Move activity',`<h3>${E(catalogItem(e.ref)?.title||'Activity')}</h3>${dateSelect('targetDate',day)}${select('targetMode','Target itinerary',[['A','Plan A'],['rain','Rainy Day']],state.active[day])}`,()=>{const date=v('targetDate'),mode=v('targetMode'),found=allEvents().find(x=>x.id===e.id);if(!found||!state.plans[mode]?.[date])return;state.plans[found.__mode][found.__day]=state.plans[found.__mode][found.__day].filter(x=>x.id!==e.id);state.plans[mode][date].push(e);day=date;save();render()})}
function templateModal(){const templates=DATES.flatMap(d=>['A','rain'].map(m=>({key:`${m}|${d}`,name:`${dateTitle(d)} · ${m==='A'?'Plan A':'Rainy Day'}`,list:SEED.plans[m][d]||[]}))).filter(x=>x.list.length);const current=plan();const html=`<p class="help">Preview the existing day-plan template, keep any current activities you want, and add selected items. Actual experiences and expenses are unaffected.</p>${select('templateKey','Choose an original day plan',templates.map(x=>[x.key,x.name]),templates[0]?.key)}<div id="templateContents"></div><label class="toggle"><input id="keepCurrent" type="checkbox" checked>Keep current planned activities</label>`;modal('Use a full-day plan',html,()=>{const [mode,date]=v('templateKey').split('|'),items=SEED.plans[mode][date]||[];const kept=$('keepCurrent').checked?[...plan()]:[];const selections=[...document.querySelectorAll('#templateContents [data-template-ref]:checked')].map(x=>x.dataset.templateRef);const seen=new Set(kept.map(x=>x.ref));for(const e of items)if(selections.includes(e.ref)&&!seen.has(e.ref)){kept.push({...copy(e),id:id(),outcome:'later',locked:false});seen.add(e.ref)}state.plans[state.active[day]][day]=kept;save();render();notify('Day plan applied')},'Apply selected');$('templateKey').addEventListener('change',showTemplate);showTemplate()}
function showTemplate(){const root=$('templateContents');if(!root)return;const [mode,date]=v('templateKey').split('|');root.innerHTML=`<div class="mini stack"><b>Include these activities</b>${(SEED.plans[mode]?.[date]||[]).map(e=>`<label class="toggle"><input type="checkbox" data-template-ref="${E(e.ref)}" checked>${E(catalogItem(e.ref)?.title||e.ref)}</label>`).join('')}</div>`}
function itemModal(){modal('New experience',`${select('newType','Kind',[['do','Activity'],['try','Thing to Try'],['buy','Thing to Buy']],'do')}${field('newTitle','Name')}${field('newLocation','Area or shop (optional)')}${textArea('newDescription','Description (optional)')}`,()=>{const title=v('newTitle').trim();if(!title)throw Error('Enter a name');const kind=v('newType');if(kind==='do')state.catalog.push({id:id(),title,kind,region:v('newLocation'),description:v('newDescription'),weather:'mixed',price:null,currency:'THB',notes:'',starred:false,effort:1});else state.wishlist.push({id:id(),title,displayName:title,kind,type:kind,shop:v('newLocation'),description:v('newDescription'),notes:'',region:'',done:false,starred:false});save();render()})}
function newExperienceModal(){const entries=[...state.catalog,...state.wishlist].sort((a,b)=>a.title.localeCompare(b.title));modal('Record an unplanned experience',`${dateSelect('newExDate',day)}${select('newExRef','From your saved catalogue',[['','Create a new entry'],...entries.map(a=>[a.id,a.displayName||a.title])],'')}${field('newExTitle','Or name a new experience','')}${field('newExPlace','Place (optional)','')}<label class="toggle"><input id="newExSave" type="checkbox"> Save a new item to my reusable catalogue</label>${textArea('newExNote','Memory (optional)','')}`,()=>{let ref=v('newExRef'),title=v('newExTitle').trim(),place=v('newExPlace').trim();if(!ref&&!title)throw Error('Choose an item or enter a name');if(ref&&!catalogItem(ref))throw Error('Item not found');if(!ref&&$('newExSave')?.checked){ref=id();state.catalog.push({id:ref,title,kind:'do',region:place,description:v('newExNote'),weather:'mixed',price:null,currency:'THB',notes:'',starred:false,effort:1})}const x={id:id(),ref:ref||null,title:ref?'':title,date:v('newExDate'),location:place||catalogItem(ref)?.region||'',time:'',note:v('newExNote'),rating:'',photos:[]};state.experiences.push(x);save();render()})}
function experienceStatus(eventId,outcome){const found=allEvents().find(x=>x.id===eventId);if(!found)return;const e=state.plans[found.__mode][found.__day].find(x=>x.id===eventId);if(outcome==='no'&&state.experiences.some(x=>x.eventId===eventId)){if(!confirm('This activity has an experience record. Remove that record? Payments and photos remain untouched.'))return;state.experiences=state.experiences.filter(x=>x.eventId!==eventId)}if(outcome==='yes'&&!state.experiences.some(x=>x.eventId===eventId)){state.experiences.push({id:id(),ref:e.ref,eventId:e.id,date:found.__day,location:catalogItem(e.ref)?.region||'',time:e.time||'',rating:'',note:'',photos:[]})}e.outcome=outcome;save();closeModal();render();notify(outcome==='yes'?'Recorded in diary':outcome==='no'?'Marked as not done':'Left for later')}
// Browser media storage: photos saved as optimised blobs in IndexedDB, never uploaded.
function openPhotos(){return new Promise((resolve,reject)=>{const r=indexedDB.open('phuket-v5-photos',1);r.onupgradeneeded=()=>r.result.createObjectStore('images');r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
async function photoPut(pid,blob){const db=await openPhotos();return new Promise((ok,bad)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').put(blob,pid);tx.oncomplete=()=>{db.close();ok()};tx.onerror=()=>{db.close();bad(tx.error)}})}
async function photoGet(pid){const db=await openPhotos();return new Promise((ok,bad)=>{const tx=db.transaction('images','readonly');const q=tx.objectStore('images').get(pid);q.onsuccess=()=>{db.close();ok(q.result||null)};q.onerror=()=>{db.close();bad(q.error)}})}
async function photoDelete(pid){const db=await openPhotos();return new Promise((ok,bad)=>{const tx=db.transaction('images','readwrite');tx.objectStore('images').delete(pid);tx.oncomplete=()=>{db.close();ok()};tx.onerror=()=>{db.close();bad(tx.error)}})}
async function photoOptimise(file){if(!file.type.startsWith('image/'))throw Error('Choose a photo, not a video');if(file.size>30*1024*1024)throw Error('Choose a photo below 30 MB');let img=await createImageBitmap(file),max=1440,s=Math.min(1,max/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*s));c.height=Math.max(1,Math.round(img.height*s));c.getContext('2d').drawImage(img,0,0,c.width,c.height);img.close?.();return await new Promise((ok,bad)=>c.toBlob(x=>x?ok(x):bad(Error('Photo processing failed')),'image/webp',0.8))}
async function photoUpload(file,target,targetId){try{const blob=await photoOptimise(file);const pid=id();await photoPut(pid,blob);photosURL[pid]=URL.createObjectURL(blob);state.photos.push(pid);if(target==='day'){state.diary[targetId].photos.push(pid)}else {const ex=state.experiences.find(x=>x.id===targetId);if(!ex)throw Error('Experience missing');ex.photos.push(pid)}save();closeModal();render();notify('Photo saved locally')}catch(e){alert('Could not save photo: '+e.message)}}
async function hydratePhotos(){for(const pid of state.photos){try{const b=await photoGet(pid);if(b)photosURL[pid]=URL.createObjectURL(b)}catch(e){}}render()}
function blobToDataURL(b){return new Promise((ok,bad)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result);fr.onerror=()=>bad(fr.error);fr.readAsDataURL(b)})}
async function backup(){try{const images={};for(const pid of state.photos){const blob=await photoGet(pid);if(blob)images[pid]=await blobToDataURL(blob)}const payload={backupFormat:'phuket-v5',created:new Date().toISOString(),state:copy(state),images};download(JSON.stringify(payload),`phuket-planner-backup-${today()}.json`,'application/json');notify('Complete backup downloaded')}catch(e){alert('Backup failed: '+e.message)}}
function download(content,filename,mime){const b=new Blob([content],{type:mime}),u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),30000)}
async function restore(file){try{const o=JSON.parse(await file.text());let restored=o.state||o;if(restored.version===4)restored=migrate(restored);if(restored.version!==5||!restored.catalog||!restored.plans)throw Error('Not a valid V4/V5 backup');if(!confirm('Replace the planner data on this device with the backup?'))return;for(const [pid,data] of Object.entries(o.images||{})){const blob=await (await fetch(data)).blob();await photoPut(pid,blob)}state=restored;loadError='';save();await hydratePhotos();notify('Backup restored')}catch(e){alert('Restore failed: '+e.message)}}
function toolsModal(){modal('Backup, restore & offline use',`<p class="small">Your plans and photos are stored on this device. Download a backup regularly, particularly before clearing browser data or changing phones.</p><div class="row wrap"><button class="btn primary" data-action="backup">Download complete backup</button><button class="btn" data-action="restore">Restore backup file</button></div><div class="help">The site can be made available offline after its first online visit. Online forecasts and new image searches need a connection.</div>`,()=>{})}
function onClick(ev){const t=ev.target.closest('[data-view],[data-day],[data-currency],[data-filter],[data-mode],[data-action],[data-outcome]');if(!t)return;const x=t.dataset;if(x.outcome){experienceStatus(x.id,x.outcome);return}if(x.currency){state.currency=x.currency;save();render();return}if(x.day){day=x.day;if(x.view)view=x.view;render();return}if(x.view){view=x.view;render();window.scrollTo(0,0);return}if(x.filter){filter=x.filter;render();return}if(x.mode){state.active[day]=x.mode;save();render();return}if(!x.action)return;const a=x.action,ref=x.id;switch(a){case 'add':addToDay(ref);break;case 'details':details(ref);break;case 'record':{const e=record(ref);if(e)expEdit(e);break}case 'star':update(()=>{catalogItem(ref).starred=!catalogItem(ref).starred});break;case 'exploreHere':{const e=plan().find(x=>x.id===ref),item=e&&catalogItem(e.ref);if(item){const isFoodStop=/market|restaurant|cafe|food|dessert/i.test((item.title||'')+' '+(item.category||''));filter=isFoodStop?'try':item.kind==='buy'?'buy':'all';region=isFoodStop?'all':item.kind==='buy'?'shop':item.region||'all';exploreHint=isFoodStop?'Foods commonly associated with markets or cafés; availability at this specific venue is not verified.':`Ideas for ${item.region||item.shop||'this stop'}; shop stock may vary.`;search='';view='explore';render();notify('Showing ideas for '+(item.title||item.region||'this stop'))}break}case 'event':{const e=plan().find(x=>x.id===ref);if(e)eventEdit(e);break}case 'outcome':{const e=plan().find(x=>x.id===ref);if(e)outcomeEdit(e);break}case 'pay':{const e=plan().find(x=>x.id===ref);if(e)expenseModal('expense',null,e.id);break}case 'up':case 'down':{const p=plan(),i=p.findIndex(x=>x.id===ref),j=i+(a==='up'?-1:1);if(i>=0&&j>=0&&j<p.length){[p[i],p[j]]=[p[j],p[i]];if(!p[i].locked&&!p[j].locked){const tm=p[i].time;p[i].time=p[j].time;p[j].time=tm}save();render()}break}case 'move':{const e=plan().find(x=>x.id===ref);if(e)moveEdit(e);break}case 'removeEvent':if(confirm('Remove this activity from the planned day? Recorded experiences and payments remain.')){state.plans[state.active[day]][day]=plan().filter(x=>x.id!==ref);closeModal();save();render()}break;case 'templates':templateModal();break;case 'browse':view='explore';exploreHint='';render();break;case 'diaryNote':diaryEdit();break;case 'dayPlanNote':dayPlanNoteEdit();break;case 'newExpense':case 'expense':closeModal();expenseModal();break;case 'newRefund':closeModal();expenseModal('refund');break;case 'expenses':expensesList();break;case 'allowances':allowanceList();break;case 'fixed':fixedList();break;case 'settings':budgetSettings();break;case 'newExperience':newExperienceModal();break;case 'newItem':itemModal();break;case 'editExperience':{const e=state.experiences.find(x=>x.id===ref);if(e)expEdit(e);break}case 'deleteSpend':if(confirm('Delete this recorded transaction?')){state.spends=state.spends.filter(x=>x.id!==ref);closeModal();save();render()}break;case 'deleteExperience':if(confirm('Delete this diary entry? Photos remain in your local library.')){state.experiences=state.experiences.filter(x=>x.id!==ref);closeModal();save();render()}break;case 'editSpend':{const e=state.spends.find(x=>x.id===ref);if(e)expenseModal(e.kind||'expense',e);break}case 'editReserve':{const e=state.reserves.find(x=>x.id===ref);if(e)reserveEdit(e);break}case 'editFixed':{const e=state.fixed.find(x=>x.id===ref);if(e)fixedEdit(e);break}case 'close':closeModal();break;case 'backup':backup();break;case 'restore':$('restoreFile').click();break;case 'tools':toolsModal();break;case 'uploadPhoto':$('photoFile').dataset.target=x.target;$('photoFile').dataset.id=ref;$('photoFile').click();break;case 'lookupPhoto':lookupPhoto(ref);break;case 'usePhoto':{const item=catalogItem(ref);item.imageUrl=x.url;save();closeModal();render();notify('Reference photo saved');break}}
}
function onChange(ev){const t=ev.target;if(t.id==='areaSelect'){region=t.value;render()}if(t.id==='scopeSelect'){scope=t.value;render()}}
const app=$('app');app.addEventListener('click',onClick);$('nav').addEventListener('click',onClick);$('editor').addEventListener('click',onClick);$('quickExpense').addEventListener('click',()=>expenseModal());$('toolBtn').addEventListener('click',toolsModal);app.addEventListener('change',onChange);$('editor').addEventListener('change',ev=>{if(ev.target.id==='templateKey')showTemplate()});app.addEventListener('input',ev=>{if(ev.target.id==='exploreSearch'){const start=ev.target.selectionStart;search=ev.target.value;render();const e=$('exploreSearch');e.focus();e.setSelectionRange(start,start)}});
$('editor').addEventListener('click',ev=>{if(ev.target.id==='modalSave'){try{modalFn?.();closeModal()}catch(e){alert(e.message)}}});
$('restoreFile').addEventListener('change',ev=>{const file=ev.target.files?.[0];if(file)restore(file);ev.target.value=''});
$('photoFile').addEventListener('change',ev=>{const file=ev.target.files?.[0];if(file)photoUpload(file,ev.target.dataset.target,ev.target.dataset.id);ev.target.value=''});
app.addEventListener('dragstart',ev=>{const x=ev.target.closest('[data-drag-event]');if(x){dragId=x.dataset.dragEvent;ev.dataTransfer.effectAllowed='move';ev.dataTransfer.setData('text/plain',dragId)}});
app.addEventListener('dragover',ev=>{if(dragId&&ev.target.closest('[data-drag-event]'))ev.preventDefault()});app.addEventListener('drop',ev=>{const x=ev.target.closest('[data-drag-event]');if(!x||!dragId||x.dataset.dragEvent===dragId)return;ev.preventDefault();const p=plan(),i=p.findIndex(e=>e.id===dragId),j=p.findIndex(e=>e.id===x.dataset.dragEvent);if(i<0||j<0)return;const [from]=p.splice(i,1);p.splice(j,0,from);if(!from.locked){const target=p[j===i?i:Math.max(0,Math.min(j,p.length-1))];if(target&&!target.locked)from.time=target.time}dragId=null;save();render()});app.addEventListener('dragend',()=>dragId=null);
async function weather(){try{const url='https://api.open-meteo.com/v1/forecast?latitude=7.88&longitude=98.39&daily=precipitation_probability_max,weather_code&timezone=Asia%2FBangkok&forecast_days=7';const r=await fetch(url,{signal:AbortSignal.timeout(6000)});if(!r.ok)return;const j=await r.json(),i=j.daily?.time?.indexOf(day);if(i>=0){const p=j.daily.precipitation_probability_max[i];weatherCache={date:day,rain:p>=45,short:`Rain chance ${p}% (Phuket area)`};render()}}catch(e){} }
// Refresh weather only when online; the rest of the app does not depend on weather APIs.
render();hydratePhotos();weather();if('serviceWorker' in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('./sw.js').catch(()=>{});
window.__phuketV5={getState:()=>copy(state),budget,addToDay,record,setDay:d=>{day=d;render()},setView:x=>{view=x;render()},save,migrate,KEY,OLD};
})();
