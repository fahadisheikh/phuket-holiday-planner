function moneyToQAR(n,cur='THB'){if(n==null||!Number.isFinite(Number(n)))return null;return Number(n)/(state.rates[cur]||1)*state.rates.QAR}
function qarTo(n,cur){return n/(state.rates.QAR||3.65)*(state.rates[cur]||1)}

function dayFigures(mode,d){let total=0,missing=0,effort=0,outdoor=0;for(const e of eventRows(mode,d)){let p=eventPrice(e);if(p==null)missing++;else total+=p;const a=cat(e.ref);effort+=Number(a?.effort)||0;if(a?.weather==='outdoor')outdoor++}return {total,missing,effort,outdoor,count:eventRows(mode,d).length}}
function fixedDay(d){return state.fixed.filter(x=>x.date===d).reduce((t,x)=>t+(moneyToQAR(x.price,x.currency)||0),0)}
function dinnerCredit(d,mode=state.active[d]){let reserved=state.reserves.find(x=>x.id==='dinner');if(!reserved?.daily?.[d])return 0;return eventRows(mode,d).some(e=>e.ref==='sheet-12')?moneyToQAR(reserved.daily[d]*reserved.price/reserveOriginalTotal(reserved),reserved.currency):0}
function reserveOriginalTotal(r){return Object.values(r.daily||{}).reduce((a,b)=>a+(Number(b)||0),0)||1}
function baseDay(d,mode=state.active[d]){let q=0;for(const r of state.reserves){let v=Number(r.daily?.[d]||0);if(v)q+=moneyToQAR(v*r.price/reserveOriginalTotal(r),r.currency)||0}return q-dinnerCredit(d,mode)}
function reserveTotal(){return state.reserves.reduce((t,r)=>t+(moneyToQAR(r.price,r.currency)||0),0)-DATES.reduce((t,d)=>t+dinnerCredit(d),0)}
function trackedSpendSplit(){let pools={food:0,shopping:0};for(const x of state.reserves)if(x.category in pools)pools[x.category]+=moneyToQAR(x.price,x.currency)||0;const usage={food:0,shopping:0},extraByDate=Object.fromEntries(DATES.map(d=>[d,0])),tracked={food:0,shopping:0};for(const d of DATES){for(const x of state.spends.filter(x=>x.date===d)){let q=moneyToQAR(x.price,x.currency)||0;if(x.category in pools){let before=Math.max(0,usage[x.category]-pools[x.category]);usage[x.category]+=q;tracked[x.category]+=q;let after=Math.max(0,usage[x.category]-pools[x.category]);extraByDate[d]+=after-before}else extraByDate[d]+=q}}return {extraByDate,tracked,usage,pools}}
function spentDay(d){return trackedSpendSplit().extraByDate[d]||0}
function countBudget(){let fixed=0,missingFixed=0;for(const x of state.fixed){const q=moneyToQAR(x.price,x.currency);if(q===null)missingFixed++;else fixed+=q}let extras=trackedSpendSplit(),extra=Object.values(extras.extraByDate).reduce((a,b)=>a+b,0),reserve=reserveTotal();
let paid=0,active=0,missing=0,paidRefs=new Set();for(const mode of ['A','rain'])for(const d of DATES)for(const e of eventRows(mode,d)){if(e.status==='paid'||e.status==='booked'){if(!paidRefs.has(e.ref)){paid+=eventPrice(e)||0;if(eventPrice(e)==null)missing++;paidRefs.add(e.ref)}}}
for(const d of DATES)for(const e of eventRows(state.active[d]||'A',d)){if(paidRefs.has(e.ref))continue;let v=eventPrice(e);if(v===null)missing++;else active+=v}
const planned=fixed+reserve+extra+paid+active;return {fixed,extra,paid,active,reserve,planned,remaining:state.budget-planned,missing:missing+missingFixed,missingFixed,tracked:extras.tracked}}
function activeDayQar(d){return dayFigures(state.active[d],d).total+fixedDay(d)+baseDay(d)+spentDay(d)}
function nav(){const entries=[['compare','🗓 Day planner'],['sunny','☀️ Plan A'],['rainy','🌧 Rainy-day plan'],['regions','📍 Region bundles'],['wishlist','⭐ Try & buy'],['budget','💰 Budget'],['sources','📒 Workbook notes']];$('nav').innerHTML=entries.map(([id,label])=>`<button data-view="${id}" class="${view===id?'active':''}">${label}</button>`).join('')}
function budgetCards(){const b=countBudget(),cl=b.remaining<0?'negative':'highlight';return `<div class="grid kpis"><article class="panel kpi ${cl}"><small>Remaining · forecast for active daily plans</small><b>${nfmt(b.remaining,'QAR')}</b><div class="amounts">${tripleFromQAR(b.remaining)}</div><div class="sub">${b.missing?'⚠ '+b.missing+' unpriced cost(s); airport transfer needs actual amount':''}</div></article><article class="panel kpi"><small>Family trip budget</small><b>${nfmt(state.budget,'QAR')}</b><div class="amounts">${tripleFromQAR(state.budget)}</div></article><article class="panel kpi"><small>Paid fixed expenses</small><b>${nfmt(b.fixed,'QAR')}</b><div class="sub">Flights + hotel + paid airport transfer (amount pending)</div></article><article class="panel kpi"><small>Recurring allowances & reserves</small><b>${nfmt(b.reserve,'QAR')}</b><div class="sub">Food, 7-Eleven, contingency, shopping · counted once</div></article><article class="panel kpi"><small>Active activity costs + extra overspend</small><b>${nfmt(b.active+b.paid+b.extra,'QAR')}</b><div class="sub">Switch individual days to see the budget change</div></article></div>`}
function formatWeather(w){return w==='indoor'?'🏠 Rain friendly':w==='outdoor'?'☀️ Needs weather':'🌤 Mixed'}
function sourceTag(a){return a.source==='sheet import'?'<span class="tag origin">From workbook</span>':a.source==='research'?'<span class="tag">Researched</span>':'<span class="tag">Editable estimate</span>'}
function activityCard(a){let p=a.price==null?'⚠ Set cost':nfmt(moneyToQAR(a.price,a.currency),'QAR');return `<div class="activity ${a.weather==='indoor'?'indoor':a.weather==='outdoor'?'outdoor':'flex'}" draggable="true" data-drag-activity="${esc(a.id)}"><div class="cardhead"><b>${esc(a.title)}</b><strong class="cost">${p}</strong></div><div class="micro">${esc(a.region)} · ${esc(a.category)} ${a.span?'· '+esc(a.span):''}</div><div class="metadata">${sourceTag(a)}<span class="tag">${formatWeather(a.weather)}</span></div><div class="currency-trio">${a.price==null?'Set total party price for currency equivalents':esc(tripleAmt(a.price,a.currency))}</div>${a.ticketTHB!==undefined?`<div class="micro">Entry ${nfmt(a.ticketTHB,'THB')} · Grab ${nfmt(a.grabTHB,'THB')} · <b>one total</b></div>`:''}${a.notes?`<div class="micro" title="${esc(a.notes)}">${esc(a.notes.slice(0,125))}${a.notes.length>125?'…':''}</div>`:''}<div class="item-actions"><button class="btn sm primary" data-add="${esc(a.id)}">＋ Add</button><button class="btn sm" data-edit-act="${esc(a.id)}">Edit / price</button></div></div>`}
function shelf(){let items=state.catalog.filter(a=>(regionFilter==='all'||a.region===regionFilter)&&(weatherFilter==='all'||a.weather===weatherFilter)&&(!librarySearch||norm(a.title+' '+a.region+' '+a.notes+' '+a.category).includes(norm(librarySearch))));return `<aside class="panel shelf"><div class="shelf-head"><h3>Activity library <span class="tag">${items.length} cards</span></h3><div class="micro">Drag onto either plan. Edit prices and remarks once.</div></div><div class="filterrow"><input id="shelfSearch" placeholder="Search: show, food, boat, museum…" value="${esc(librarySearch)}"><select id="shelfRegion"><option value="all">All regions</option>${REGIONS.concat([...new Set(state.catalog.map(x=>x.region))].filter(x=>!REGIONS.includes(x))).map(r=>`<option ${r===regionFilter?'selected':''}>${esc(r)}</option>`).join('')}</select><select id="shelfWeather"><option value="all">Any weather</option><option value="indoor" ${weatherFilter==='indoor'?'selected':''}>Indoor / rain friendly</option><option value="mixed" ${weatherFilter==='mixed'?'selected':''}>Mixed weather</option><option value="outdoor" ${weatherFilter==='outdoor'?'selected':''}>Outdoor</option></select><button class="btn sm" data-action="newActivity">+ New activity</button></div><div class="shelf-list">${items.length?items.map(activityCard).join(''):'<div class="empty">No matching activities</div>'}</div></aside>`}
function pinned(d){let f=state.fixed.filter(x=>x.date===d);return f.length?`<div class="notice green"><b>🔒 Prepaid — fixed, not draggable</b><div class="statrow">${f.map(x=>`<span class="tag paid">${esc(x.title)} · ${x.price==null?'price missing':nfmt(moneyToQAR(x.price,x.currency),'QAR')}</span>`).join('')}</div>${f.some(x=>x.price==null)?'<div class="micro">Airport transfer is marked paid but its price was not visible in the budget tab. Add the actual amount in Budget settings.</div>':''}</div>`:''}
function eventCard(e,d,mode){const a=cat(e.ref);if(!a)return `<div class="event">Missing activity record (${esc(e.ref)}) <button class="btn sm" data-remove="${esc(e.id)}" data-mode="${mode}" data-date="${d}">Remove</button></div>`;let q=eventPrice(e);return `<div class="event ${a.weather==='outdoor'?'outdoor':a.weather==='indoor'?'indoor':'flex'}" draggable="true" data-drag-event="${e.id}" data-mode="${mode}" data-date="${d}"><div class="cardhead"><b>${esc(a.title)}</b><span class="cost">${q==null?'⚠ Cost?':nfmt(q,'QAR')}</span></div><div class="micro">${esc(e.time||a.time||'Time flexible')} · ${esc(a.region)} · ${esc(a.category)}</div><div class="metadata"><span class="tag ${e.status==='paid'?'paid':''}">${e.status==='paid'?'✓ Paid':e.status==='booked'?'🎟 Booked':'Planned'}</span><span class="tag">${formatWeather(a.weather)}</span>${q!=null?`<span class="tag">${nfmt(qarTo(q,'THB'),'THB')}</span>`:''}</div><div class="currency-trio">${q==null?'⚠ Unknown total':tripleAmt(e.overridePrice??a.price,e.overrideCurrency??a.currency)}</div>${a.ticketTHB!==undefined?`<p class="micro">Entry ${nfmt(a.ticketTHB,'THB')} + return Grab ${nfmt(a.grabTHB,'THB')} (included in the price above)</p>`:''}${a.notes?`<p class="micro">${esc(a.notes)}</p>`:''}<div class="line-buttons"><button class="btn sm" data-edit-evt="${e.id}" data-mode="${mode}" data-date="${d}">⏱ Time / spend</button><button class="btn sm warn" data-remove="${e.id}" data-mode="${mode}" data-date="${d}">Remove</button></div></div>`}
function planPanel(mode,d){let v=dayFigures(mode,d),isActive=state.active[d]===mode;let cautions=[];if(v.effort>=6)cautions.push('Tiring day: consider removing a stop or adding rest');if(mode==='rain'&&v.outdoor)cautions.push('Outdoor stops in rainy plan: swap if rain is heavy');if(mode==='A'&&v.outdoor)cautions.push('Outdoor activities depend on local conditions');return `<div class="plan-col ${mode==='rain'?'rain':''}"><div class="plan-top"><div><h3>${mode==='A'?'☀️ Plan A · good weather':'🌧 Rainy-day alternative'}</h3><div class="micro">${v.count} activities · ${v.effort>=6?'High effort':v.effort>=3?'Moderate effort':'Relaxed day'}</div></div><div style="text-align:right"><div class="plan-cost">${nfmt(v.total,'QAR')}</div><div class="micro">${nfmt(qarTo(v.total,'USD'),'USD')} · ${nfmt(qarTo(v.total,'THB'),'THB')} · ${v.missing?v.missing+' unpriced':'priced items'}</div></div></div><div class="dropzone" data-drop-mode="${mode}" data-drop-date="${d}">${eventRows(mode,d).length?eventRows(mode,d).map(e=>eventCard(e,d,mode)).join(''):'<div class="empty">Drag activity cards here<br>or use ＋ Add</div>'}</div>${mode==='rain'&&state.rainNotes?.[d]?`<div class="micro" style="margin-top:10px">☔ ${esc(state.rainNotes[d])}</div>`:''}${cautions.length?`<div class="micro" style="color:#9a5f28;margin-top:10px">⚠ ${esc(cautions.join(' · '))}</div>`:''}<div class="replace"><button class="btn sm ${isActive?'used-toggle':''}" data-activate="${mode}" data-date="${d}">${isActive?'✓ Used in budget':'Use this plan for '+dateLabel(d)}</button><button class="btn sm" data-pick="${mode}" data-date="${d}">＋ Add</button><button class="btn sm" data-copy="${mode}" data-date="${d}" title="Copy activities in this plan to the other plan">Copy → other</button></div></div>`}
function dateTabs(){return `<div class="day-nav" id="dayNav">${DATES.map(d=>`<button data-day="${d}" class="${d===day?'active':''}"><b>${dateLabel(d)}</b><small>${state.active[d]==='rain'?'🌧 Rainy':'☀️ Plan A'}</small></button>`).join('')}</div>`}
function daySummary(){return `<div class="strip">${DATES.map(d=>{let a=dayFigures('A',d),r=dayFigures('rain',d),n=activeDayQar(d);return `<button class="day-mini ${d===day?'selected':''}" data-day="${d}"><strong>${dateLabel(d)}</strong><div class="micro">☀️ ${nfmt(a.total,'QAR')}</div><div class="micro">🌧 ${nfmt(r.total,'QAR')}</div><div class="sum">Active ${nfmt(n,'QAR')}</div><div class="micro">${nfmt(qarTo(n,'USD'),'USD')} / ${nfmt(qarTo(n,'THB'),'THB')}</div><div class="micro">${a.missing+r.missing?'⚠ Some prices missing':''}</div></button>`}).join('')}</div>`}
function compare(){return `${budgetCards()}<div class="section-top"><div><h2>Build your holiday, one day at a time</h2><p>Both itineraries stay visible and independent. Drag cards into either column, then choose which plan counts against your budget for that date.</p></div><div class="subnav"><button class="btn" data-view="regions">Browse area bundles →</button><button class="btn primary" data-view="sources">View original workbook notes →</button></div></div><div class="notice green"><b>✓ Preloaded from all 9 workbook tabs</b> · Using revised 15k costed plan, family-of-four activity quotes (entry + Grab), plus your Plan A anchors and Rainy Day swaps. Airport transfer is booked but its payment amount needs your confirmation. <b>Original quotes may not match children's current age/height ticket categories.</b></div><div class="layout">${shelf()}<div><div class="panel pad">${dateTabs()}<div class="day-title"><h2>${dateLabel(day)} · ${state.active[day]==='A'?'Plan A selected':'Rainy alternative selected'}</h2><span class="tag">Active day: ${nfmt(activeDayQar(day),'QAR')} · ${nfmt(qarTo(activeDayQar(day),'USD'),'USD')} · ${nfmt(qarTo(activeDayQar(day),'THB'),'THB')}</span></div>${pinned(day)}${state.anchor?.[day]?`<div class="notice blue"><b>Workbook anchor:</b> ${esc(state.anchor[day].title)}${state.anchor[day].timing?` · ${esc(state.anchor[day].timing)}`:""}<div class="micro">${esc(state.anchor[day].evening||"")} ${esc(state.anchor[day].notes||"")}</div></div>`:""}<div class="compare-grid">${planPanel('A',day)}${planPanel('rain',day)}</div><div class="notice blue"><b>Daily breakdown:</b> ${nfmt(dayFigures(state.active[day],day).total,'QAR')} scheduled + ${nfmt(fixedDay(day),'QAR')} prepaid + ${nfmt(spentDay(day),'QAR')} extra spending = <b>${nfmt(activeDayQar(day),'QAR')}</b>. ${dayFigures(state.active[day],day).missing?'Some activity prices are still missing.':''}</div><label>Day notes / weather / transport</label><textarea data-daynote="${day}" placeholder="Travel times, rain check, tiredness, shopping reminders…">${esc(state.dayNotes[day]||'')}</textarea><button class="btn sm" data-action="saveDayNote">Save day note</button></div><div class="section-top" style="margin-top:18px"><h3>All days at a glance</h3><span class="micro">Tap a date to edit</span></div>${daySummary()}</div></div>`}
function planView(mode){let title=mode==='A'?'☀️ Plan A — good-weather itinerary':'🌧 Rainy-day plan — separate itinerary';return `${budgetCards()}<div class="section-top"><div><h2>${title}</h2><p>This is a separate editable ${mode==='A'?'outdoor-first':'rain-friendlier'} schedule. Drag activities into a particular date; choose “Use this plan” to update the live budget.</p></div><button class="btn" data-view="compare">Compare plans side by side</button></div><div class="layout">${shelf()}<div class="stack">${DATES.map(d=>{let v=dayFigures(mode,d);return `<section class="panel pad"><div class="plan-top"><div><h3>${dateLabel(d)} ${state.active[d]===mode?'<span class="tag origin">Active</span>':''}</h3><div class="micro">Cost ${nfmt(v.total,'QAR')} + prepaid ${nfmt(fixedDay(d),'QAR')} + allowances ${nfmt(baseDay(d,mode),'QAR')} + extras ${nfmt(spentDay(d),'QAR')} ${v.missing?'· '+v.missing+' prices missing':''}</div></div><button class="btn sm" data-activate="${mode}" data-date="${d}">Use ${mode==='A'?'Plan A':'Rainy'} this day</button></div>${pinned(d)}${mode==='rain'&&state.rainNotes?.[d]?`<div class="micro" style="margin:10px 0">☔ ${esc(state.rainNotes[d])}</div>`:''}<div class="dropzone" data-drop-mode="${mode}" data-drop-date="${d}">${eventRows(mode,d).map(e=>eventCard(e,d,mode)).join('')||'<div class="empty">Drop activity cards here</div>'}</div><div class="replace"><button class="btn sm" data-pick="${mode}" data-date="${d}">+ Add activity</button><button class="btn sm" data-copy="${mode}" data-date="${d}">Copy into ${mode==='A'?'Rainy':'Plan A'}</button></div></section>`}).join('')}</div></div>`}
function regions(){let areas=[...new Set(state.catalog.map(a=>a.region))];return `${budgetCards()}<div class="section-top"><div><h2>Explore by area, weather and energy</h2><p>Activities are grouped so a show can be paired with nearby choices rather than a long drive. Add a complete group or choose individual cards. Prices marked unknown do not count until entered.</p></div><button class="btn" data-view="compare">← Back to day planner</button></div><div class="notice blue"><b>Example — Siam Niramit:</b> Choose a gentle Phuket Town day (Old Town or museum + lunch + rest), then the village from 17:30 and theatre at 20:30. It closes on Tuesdays. In heavy rain, keep the indoor show but skip exposed walking, or use Central Phuket indoor attractions instead. Old Town and the Rassada show site are different stops: allow transfer time. Your workbook quotes ฿6,800 tickets + ฿900 Grab. Buffet dinner can replace that day’s ฿900 food allocation. <a href="${SRC.siam}" target="_blank" rel="noopener">Official show schedule ↗</a></div><div class="smallh" style="margin-top:20px">Curated day bundles · reasonable combinations</div><div class="region-grid" style="margin-bottom:20px">${RECOMMENDED_BUNDLES.map(x=>`<article class="panel region"><div class="cardhead"><h3>${esc(x.title)}</h3><span class="tag ${x.weather==='indoor'?'rain':'sun'}">${formatWeather(x.weather)}</span></div><p class="hint">${esc(x.why)}</p><div class="items">${x.items.map(id=>`<div class="item">${esc(cat(id)?.title||id)} · ${cat(id)?.price==null?'Price needed':nfmt(moneyToQAR(cat(id).price,cat(id).currency),'QAR')}</div>`).join('')}</div><div class="micro" style="color:#986c3c">⚠ ${esc(x.warn)}</div><div class="replace"><button class="btn sm primary" data-curated="${x.id}" data-curated-mode="A">＋ Plan A</button><button class="btn sm" data-curated="${x.id}" data-curated-mode="rain">＋ Rainy</button></div></article>`).join('')}</div><div class="smallh">Full catalogue by region · add cards individually</div><div class="region-grid">${areas.map(region=>{const group=state.catalog.filter(a=>a.region===region);const items=group.filter(a=>a.category!=='Rest');const indoor=group.filter(a=>a.weather==='indoor').length;return `<article class="panel region"><div class="cardhead"><h3>📍 ${esc(region)}</h3><span class="tag">${group.length} options</span></div><p class="hint">${esc(REGION_HINTS[region]||'Grouped by region imported from your workbook.')}</p><div class="metadata"><span class="tag rain">${indoor} indoor</span><span class="tag">${group.filter(a=>a.price==null).length} prices pending</span></div><div class="items">${items.map(a=>`<div class="item" draggable="true" data-drag-activity="${esc(a.id)}"><b>${esc(a.title)}</b><p>${esc(a.span||'Flexible')} · ${formatWeather(a.weather)} · ${a.effort>=3?'High':a.effort>=2?'Medium':'Low'} energy</p><div class="line-buttons"><span class="cost">${a.price==null?'Price needed':nfmt(moneyToQAR(a.price,a.currency),'QAR')}</span><button class="btn sm" data-add="${a.id}">+ Add</button><button class="btn sm" data-edit-act="${a.id}">Edit</button></div></div>`).join('')}</div><div class="replace"><button class="btn sm primary" data-bundle="${esc(region)}" data-bundle-mode="A">Add region to Plan A</button><button class="btn sm" data-bundle="${esc(region)}" data-bundle-mode="rain">Add to Rainy</button></div><div class="smallnote">Bundle includes ${items.length} cards — review effort and remove extras; grouping does not guarantee one-day feasibility.</div></article>`}).join('')}</div><div class="sources" style="margin-top:18px"><b>Research references:</b> ${Object.entries(SRC).filter(([k])=>k!=='market').map(([k,u])=>`<a href="${u}" target="_blank" rel="noopener">${esc(k)} ↗</a>`).join('')}</div>`}
function wishlist(){return `<div class="section-top"><div><h2>Things we must try, buy and remember</h2><p>Use this list on the holiday. Mark completed items or turn them into an activity for a particular day.</p></div><button class="btn primary" data-action="newWish">+ Add wish</button></div><div class="twocol">${[['try','🍜 Must try'],['buy','🛍️ Must buy'],['see','📸 Must see / do']].map(([k,l])=>`<section class="panel pad"><h3>${l}</h3>${state.wishlist.filter(x=>x.type===k||(k==='see'&&x.type==='do')).map(x=>`<div class="listitem ${x.done?'done':''}"><input type="checkbox" data-checkwish="${x.id}" ${x.done?'checked':''}><div class="wish-main"><b>${esc(x.title)}</b><div class="micro">${esc(x.notes||'')}</div></div><button class="btn sm" data-wish-add="${x.id}">Plan</button><button class="btn sm" data-editwish="${x.id}">✎</button></div>`).join('')||'<div class="empty">No items yet</div>'}</section>`).join('')}</div>`}
function budget(){const b=countBudget();return `${budgetCards()}<div class="section-top"><div><h2>Budget tracker · workbook's revised QAR 15k plan</h2><p>Prepaid expenses stay fixed. Daily food, shopping, essentials and contingency are reserved <b>once</b>. Activity cards include their quoted entry and Grab. Shopping and food entries logged as actual spending draw from their existing allowances; only an overrun reduces remaining budget again.</p></div><button class="btn primary" data-action="newSpend">+ Log an expense</button></div><div class="notice ${b.missingFixed?'':'blue'}"><b>${b.missingFixed?'⚠ Missing prepaid airport transfer amount:':'Forecast arithmetic:'}</b> QAR ${state.budget.toLocaleString('en-GB')} − fixed ${nfmt(b.fixed,'QAR')} − planned allowances ${nfmt(b.reserve,'QAR')} − activities ${nfmt(b.active+b.paid,'QAR')} − extra beyond allowances ${nfmt(b.extra,'QAR')} = <b>${nfmt(b.remaining,'QAR')} remaining</b>. The original costed tab projects QAR 14,825 (QAR 175 headroom) before the unknown transfer amount.</div><section class="panel pad" style="margin-top:15px"><h3>🔒 Paid fixed costs (cannot be dragged away)</h3><div class="table-wrap"><table><thead><tr><th>Paid item</th><th>Assigned</th><th>Entered price</th><th>QAR</th><th></th></tr></thead><tbody>${state.fixed.map(x=>`<tr><td><b>${esc(x.title)}</b><div class="micro">${esc(x.source)}</div></td><td>${dateLabel(x.date)}</td><td>${x.price==null?'Unknown (not assumed free)':nfmt(x.price,x.currency)}</td><td>${x.price==null?'⚠ Missing':nfmt(moneyToQAR(x.price,x.currency),'QAR')}</td><td><button class="btn sm" data-editfixed="${x.id}">Enter actual</button></td></tr>`).join('')}</tbody></table></div></section><section class="panel pad" style="margin-top:15px"><h3>Recurring food, shopping & contingency allowances</h3><p class="micro">These amounts are budgeted, not necessarily spent. Allocations come from the revised costed tab, plus the Shopping line in the original Plan tab. Changing an allowance reallocates its existing day shares proportionally.</p><div class="table-wrap"><table><thead><tr><th>Allowance</th><th>Original currency</th><th>QAR</th><th>Notes</th><th></th></tr></thead><tbody>${state.reserves.map(r=>`<tr><td><b>${esc(r.title)}</b><div class="micro">${esc(r.source)}</div></td><td>${nfmt(r.price,r.currency)}</td><td>${nfmt(moneyToQAR(r.price,r.currency),'QAR')}</td><td class="micro">${esc(r.notes)}</td><td><button class="btn sm" data-editreserve="${r.id}">Edit</button></td></tr>`).join('')}</tbody></table></div><div class="micro">If you schedule a Siam Niramit buffet, that day's pre-allocated dinner (typically ฿900) is released automatically so it isn't double-counted.</div></section><div class="twocol" style="margin-top:15px"><section class="panel pad"><h3>Exchange rates from workbook</h3><div class="form-grid"> <div class="field"><label>Budget (QAR)</label><input id="budgetAmount" type="number" min="0" step=".01" value="${state.budget}"></div><div class="field"><label>QAR for 1 USD</label><input id="qarRate" type="number" min=".001" step=".001" value="${state.rates.QAR}"></div><div class="field"><label>THB for 1 USD</label><input id="thbRate" type="number" min=".001" step=".001" value="${state.rates.THB}"></div></div><div class="buttons-right"><button class="btn primary" data-action="saveRates">Save exchange rates</button></div></section><section class="panel pad"><h3>Older Plan tab — comparison only</h3><p class="micro">The Plan tab's older allocation totals QAR 15,689.61. The newer 15k costed tab itemises food/Grab differently and projects QAR 14,825. Keep these separate; don't add both budgets.</p><table><thead><tr><th>Older allowance</th><th>USD</th></tr></thead><tbody>${state.envelopes.map(e=>`<tr><td>${esc(e.label)}</td><td>${nfmt(e.usd,'USD')}</td></tr>`).join('')}</tbody></table></section></div><section class="panel pad" style="margin-top:15px"><div class="section-top"><div><h3>Actual expense ledger</h3><p>Food and shopping draw against their existing allowance. Other transport / additional expenses count immediately.</p></div><button class="btn primary" data-action="newSpend">+ Record expense</button></div><div class="table-wrap"><table><thead><tr><th>Date</th><th>Expense</th><th>Category</th><th>Entered</th><th>QAR</th><th></th></tr></thead><tbody>${state.spends.map(x=>`<tr><td>${dateLabel(x.date)}</td><td>${esc(x.title)}</td><td>${esc(x.category||'other')}</td><td>${nfmt(x.price,x.currency)}</td><td>${nfmt(moneyToQAR(x.price,x.currency),'QAR')}</td><td><button class="btn sm" data-editspend="${x.id}">Edit</button></td></tr>`).join('')||'<tr><td colspan="6">Nothing logged yet</td></tr>'}</tbody></table></div><p class="micro">Tracked against allowance: food ${nfmt(b.tracked.food,'QAR')} · shopping ${nfmt(b.tracked.shopping,'QAR')} · extra beyond reserves ${nfmt(b.extra,'QAR')}.</p></section><section class="panel pad" style="margin-top:15px"><h3>Daily forecast (QAR)</h3><div class="table-wrap"><table><thead><tr><th>Day</th><th>Plan A cards</th><th>Rainy cards</th><th>Active</th><th>Food / shopping / supplies</th><th>Prepaid</th><th>Over-allowance extras</th><th>Daily total</th></tr></thead><tbody>${DATES.map(d=>`<tr><td>${dateLabel(d)}</td><td>${nfmt(dayFigures('A',d).total,'QAR')}</td><td>${nfmt(dayFigures('rain',d).total,'QAR')}</td><td>${state.active[d]==='rain'?'🌧 Rainy':'☀️ A'}</td><td>${nfmt(baseDay(d),'QAR')}</td><td>${nfmt(fixedDay(d),'QAR')}</td><td>${nfmt(spentDay(d),'QAR')}</td><td><b>${nfmt(activeDayQar(d),'QAR')}</b></td></tr>`).join('')}</tbody></table></div><p class="micro">The contingency reserve (฿2,000) is included in the trip total, but deliberately not assigned to a specific day. Day totals therefore need not sum exactly to the overall forecast.</p></section>`}
function importPage(){return `${budgetCards()}<div class="section-top"><div><h2>Import the full Google Sheets workbook</h2><p>Import all tabs at once, including Plan A, Rainy days, activity prices, region/category/remarks, where the original workbook exposes them as cells.</p></div><a class="btn" href="${SHEET}" target="_blank" rel="noopener">Open original sheet ↗</a></div><div class="notice blue"><b>Why import?</b> Public-link preview lets this environment read the first budget tab but not all workbook worksheets. That isn't a sharing problem. In Google Sheets choose <b>File → Download → Microsoft Excel (.xlsx)</b>, then select the downloaded file below. The import is read locally in this browser: it is not uploaded to a server.</div><div class="twocol"><section class="panel pad"><h3>1 · Choose workbook</h3><p class="micro">Reads all tabs and previews matches before replacing any schedule. Keeps cells' categories, region and remarks when identifiable.</p><input type="file" id="workbookFile" accept=".xlsx,.csv" style="margin-top:12px"><div class="form-grid" style="margin-top:12px"><div class="field"><label>Plan A tab name contains</label><input id="planHint" value="Plan A" placeholder="Plan A"></div><div class="field"><label>Rainy tab name contains</label><input id="rainHint" value="rain" placeholder="rain"></div></div><div class="buttons-right"><button class="btn primary" data-action="previewImport">Inspect all worksheets</button></div></section><section class="panel pad"><h3>2 · Review import</h3><div id="previewResult">${importPreview?importPreviewHtml():'<div class="empty">Choose a workbook to inspect its tabs and row mapping.</div>'}</div></section></div><div class="panel pad" style="margin-top:15px"><h3>Fallback: paste a tab</h3><p class="micro">Useful if Excel import struggles with a formatted layout. Copy cells including headers and paste them below.</p><div class="form-grid" style="margin-top:10px"><div><label>Tab name</label><input id="pasteName" value="Itinerary Plan A"></div><div><label>Send dated rows to</label><select id="pasteMode"><option value="auto">Detect from name</option><option value="A">Plan A</option><option value="rain">Rainy-day plan</option><option value="library">Activity library only</option></select></div><div class="full"><label>Copied table</label><textarea id="pasteData" style="height:125px" placeholder="Activity\tRegion\tCategory\tRemarks\tCost THB\tDate…"></textarea></div></div><div class="buttons-right"><button class="btn" data-action="pastePreview">Inspect pasted rows</button></div></div><div class="panel pad" style="margin-top:15px"><h3>Previous imports</h3>${state.importLogs.length?state.importLogs.map(i=>`<div class="micro">✓ ${esc(i.date)} · ${esc(i.summary)}</div>`).join(''):'<div class="micro">No original workbook tabs imported yet. Starter costs for individual activities are intentionally unverified.</div>'}</div>`}
function importPreviewHtml(){return `<div class="micro">${esc(importPreview.name)} · ${importPreview.tabs.length} tabs discovered</div><div class="table-wrap"><table><thead><tr><th>Tab</th><th>Activity rows</th><th>Destination</th><th>Priced</th></tr></thead><tbody>${importPreview.tabs.map(t=>`<tr><td>${esc(t.name)}</td><td>${t.records.length}</td><td>${t.mode==='A'?'Plan A':t.mode==='rain'?'Rainy':'Library'}</td><td>${t.records.filter(x=>x.price!=null).length}</td></tr>`).join('')}</tbody></table></div><p class="micro">Review destination and import. Existing starter/example schedules are replaced on days that have imported dated activities; other days remain unchanged. Existing paid fixed costs stay locked.</p><div class="buttons-right"><button class="btn primary" data-action="applyImport">Import ${importPreview.tabs.reduce((n,t)=>n+t.records.length,0)} rows</button></div>`}
function references(){const r=WORKBOOK_REF;return `${budgetCards()}<div class="section-top"><div><h2>Your original workbook · 9 tabs read</h2><p>These are the notes from the uploaded Excel file, not suggestions invented by the planner. The day boards are already pre-populated. Alternative hotel quotes are reference only and do not affect the booked KK Karon cost.</p></div><a class="btn" href="${SHEET}" target="_blank" rel="noopener">Google Sheet ↗</a></div><div class="notice blue"><b>Which budget?</b> The original Plan tab forecasts QAR 15,689.61. “Things to do – Plan A costed” contains a revised QAR 15k plan forecasting QAR 14,825.00. This planner uses the <b>revised costed plan</b> and its USD/THB rate 33.22 and QAR/USD rate 3.65.</div><section class="panel pad"><h3>Plan A area-themes from workbook</h3><div class="table-wrap"><table><thead><tr><th>Theme</th><th>Hotel travel</th><th>Morning</th><th>Afternoon</th><th>Evening</th><th>Best day</th><th>If rain</th></tr></thead><tbody>${r.themes.filter(x=>x[0]&&String(x[0])!=='Theme / area').map(x=>`<tr><td><b>${esc(x[0])}</b></td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td>${esc(x[3])} ${esc(x[4])}</td><td>${esc(x[5])}</td><td>${esc(x[6])}</td><td>${esc(x[7])}</td></tr>`).join('')}</tbody></table></div></section><section class="panel pad" style="margin-top:15px"><h3>Rainy-day swap rules · verbatim meaning from tab</h3><div class="table-wrap"><table><thead><tr><th>Original theme</th><th>Alternative</th><th>Hours</th><th>From Karon</th><th>Notes</th></tr></thead><tbody>${r.rainSwaps.filter(x=>x[0]&&String(x[0])!=='Theme (Plan A)').map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td>${esc(x[3])}</td><td>${esc(x[4])}</td></tr>`).join('')}</tbody></table></div></section><section class="panel pad" style="margin-top:15px"><h3>Friday prayer / airport options</h3><div class="table-wrap"><table><thead><tr><th>Scenario</th><th>Plan</th><th>Place</th><th>Travel</th><th>Notes</th></tr></thead><tbody>${r.jummah.filter(x=>x[0]).map(x=>`<tr><td>${esc(x[0])}</td><td>${esc(x[1])}</td><td>${esc(x[2])}</td><td>${esc(x[3])}</td><td>${esc(x[4])}</td></tr>`).join('')}</tbody></table></div></section><section class="panel pad" style="margin-top:15px"><h3>Hotel comparison from the Hotels tab</h3><p class="micro">Only <b>KK Karon Hotel ($588)</b> from the Plan tab is paid/budgeted. Hotel comparison quotes below are not bookings and do not change the forecast.</p><div class="table-wrap"><table><thead><tr><th>Hotel</th><th>Quote (USD)</th><th>Your remarks</th></tr></thead><tbody>${r.hotels.filter(x=>x[0]).map(x=>`<tr><td>${esc(x[0])}</td><td>${x[3]!=null?nfmt(x[3],'USD'):'—'}</td><td>${esc(x[4])}</td></tr>`).join('')}</tbody></table></div></section><p class="micro" style="margin-top:12px">Original workbook: Plan, Things to do, Things to do – Plan A costed, Itinerary Plan A, Itinerary Rainy Day Plan, Packing (empty), Food to eat, 7-eleven, Hotels.</p>`}
function render(){nav();$('app').innerHTML=view==='compare'?compare():view==='sunny'?planView('A'):view==='rainy'?planView('rain'):view==='regions'?regions():view==='wishlist'?wishlist():view==='budget'?budget():references();}
function showDialog(title,description,body,buttons){$('dialogBody').innerHTML=`<h2>${esc(title)}</h2><p>${esc(description)}</p>${body}<div class="buttons-right">${buttons||'<button class="btn" data-close="1">Cancel</button><button class="btn primary" data-modal-save="1">Save</button>'}</div>`;$('dialog').showModal();}
function closeDialog(){if($('dialog').open)$('dialog').close()}
function inputField(id,label,value,type='text',extra=''){return `<div class="field"><label for="${id}">${esc(label)}</label><input id="${id}" type="${type}" ${type==='number'?'min="0" step="any"':''} value="${esc(value??'')}" ${extra}></div>`}
function selectField(id,label,options,value){return `<div class="field"><label for="${id}">${esc(label)}</label><select id="${id}">${options.map(o=>{let [v,t]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===value?'selected':''}>${esc(t)}</option>`}).join('')}</select></div>`}
function priceFields(prefix,a){return inputField(prefix+'price','Price · total for your party',a.price,'number')+selectField(prefix+'currency','Entered in',['THB','USD','QAR'],a.currency||'THB')}
function editAct(id){let a=id?cat(id):null,base=a||{title:'',region:'Other / Unassigned',category:'Activity',price:null,currency:'THB',weather:'mixed',effort:1,span:'',time:'',notes:'',url:'',source:'custom'};showDialog(a?'Edit activity & pricing':'Add custom activity','Prices convert instantly on the planner; blank means unknown, not free.',`<div class="form-grid">${inputField('a_title','Activity name',base.title,'text','required')}${selectField('a_region','Region',[...new Set(REGIONS.concat(state.catalog.map(x=>x.region)))],base.region)}${inputField('a_category','Category',base.category)}${priceFields('a_',base)}<div class="field full" id="liveExchange">${base.price==null?'Enter a price to see THB / USD / QAR':esc(tripleAmt(base.price,base.currency))}</div>${selectField('a_weather','Weather',['indoor','mixed','outdoor'],base.weather)}${selectField('a_effort','Energy level',[[0,'Rest'],[1,'Low'],[2,'Medium'],[3,'High']],Number(base.effort))}${inputField('a_time','Suggested start (HH:MM)',base.time,'time')}${inputField('a_span','Duration / time window',base.span)}<div class="field full"><label>Remarks · from sheet or your notes</label><textarea id="a_notes">${esc(base.notes)}</textarea></div>${inputField('a_url','Research link',base.url)}</div>`);
$('dialog').dataset.handler='act';$('dialog').dataset.id=id||'';}
function editEvt(id,mode,d){let e=eventRows(mode,d).find(x=>x.id===id);if(!e)return;let a=cat(e.ref);if(!a)return;showDialog('Schedule activity','Change this occurrence only. Mark “Booked / paid” if the price remains committed even after a rainy-day swap.',`<div class="form-grid"><div class="full"><b>${esc(a.title)}</b><div class="micro">${esc(a.region)}</div></div>${inputField('e_time','Start time',e.time,'time')}${selectField('e_status','Status',[['planned','Planned'],['booked','Booked — committed'],['paid','Paid — committed']],e.status)}${inputField('e_price','Override cost for this day (optional)',e.overridePrice,'number')}${selectField('e_currency','Cost override currency',['THB','USD','QAR'],e.overrideCurrency||a.currency)}<div class="field full"><label>Notes for this occurrence</label><textarea id="e_note">${esc(e.note)}</textarea></div></div>`);
$('dialog').dataset.handler='event';Object.assign($('dialog').dataset,{id,mode,date:d})}
function fixedModal(id){let x=state.fixed.find(x=>x.id===id);if(!x)return;showDialog('Prepaid cost','Already paid and locked into the budget. Edit its price/currency, but it stays fixed and counted regardless of the daily plan.',`<div class="form-grid"><div class="full"><b>${esc(x.title)}</b></div>${priceFields('f_',x)}<div class="field full" id="liveExchange">${x.price==null?'Add actual prepaid cost':esc(tripleAmt(x.price,x.currency))}</div></div>`);$('dialog').dataset.handler='fixed';$('dialog').dataset.id=id}
function spendModal(id){let x=state.spends.find(x=>x.id===id),s=x||{title:'',date:day,price:null,currency:'THB',category:'other'};showDialog(id?'Edit extra expense':'Log extra spending','Use for meals, taxis and shopping not already priced as a day activity.',`<div class="form-grid">${inputField('s_title','Item / expense',s.title)}${selectField('s_date','Date',DATES.map(d=>[d,dateLabel(d)]),s.date)}${selectField('s_category','Spending type', [['food','Food · draws food allowance'],['shopping','Shopping · draws shopping allowance'],['transport','Extra transport'],['other','Other extra cost']],s.category||'other')}${priceFields('s_',s)}<div class="field full" id="liveExchange">${s.price==null?'Enter a price to see equivalents':esc(tripleAmt(s.price,s.currency))}</div></div>`,`${id?'<button class="btn warn" data-delete-spend="'+id+'">Delete</button>':''}<button class="btn" data-close="1">Cancel</button><button class="btn primary" data-modal-save="1">Save</button>`);$('dialog').dataset.handler='spend';$('dialog').dataset.id=id||''}
function reserveModal(id){let x=state.reserves.find(r=>r.id===id);if(!x)return;showDialog('Adjust reserved allowance','The baseline is a forecast, not necessarily a payment. Change the amount in its original currency; its daily distribution will scale automatically.',`<div class="form-grid"><div class="full"><b>${esc(x.title)}</b><p class="micro">${esc(x.notes)}</p></div>${inputField('r_price','Budgeted amount ('+x.currency+')',x.price,'number')}<div class="field"><label>Currency from workbook</label><input disabled value="${x.currency}"></div></div>`);$('dialog').dataset.handler='reserve';$('dialog').dataset.id=id}
function wishModal(id){let x=state.wishlist.find(x=>x.id===id),v=x||{title:'',type:'try',notes:''};showDialog('Must try / buy / see','Keep a practical checklist during the holiday.',`<div class="form-grid">${inputField('w_title','What',v.title)}${selectField('w_type','Type',['try','buy','see','do'],v.type)}<div class="field full"><label>Notes</label><textarea id="w_notes">${esc(v.notes)}</textarea></div></div>`);$('dialog').dataset.handler='wish';$('dialog').dataset.id=id||''}
function modalSave(){let dlg=$('dialog'),type=dlg.dataset.handler,id=dlg.dataset.id;if(type==='act'){let title=$('a_title').value.trim(),num=$('a_price').value.trim()===''?null:Number($('a_price').value);if(!title||num!=null&&(!Number.isFinite(num)||num<0))return alert('Check name and price');let a=id?cat(id):null,updates={title,region:$('a_region').value,category:$('a_category').value.trim(),price:num,currency:$('a_currency').value,weather:$('a_weather').value,effort:Number($('a_effort').value),time:$('a_time').value,span:$('a_span').value,notes:$('a_notes').value,url:$('a_url').value};if(a)Object.assign(a,updates);else state.catalog.push({id:uid(),source:'custom',sourceDetail:'Entered on this device',...updates})}
if(type==='event'){let e=eventRows(dlg.dataset.mode,dlg.dataset.date).find(x=>x.id===id);if(e)Object.assign(e,{time:$('e_time').value,status:$('e_status').value,overridePrice:$('e_price').value.trim()===''?null:Number($('e_price').value),overrideCurrency:$('e_currency').value,note:$('e_note').value})}
if(type==='reserve'){let x=state.reserves.find(r=>r.id===id);let n=Number($('r_price').value);if(!x||$('r_price').value.trim()===''||!Number.isFinite(n)||n<0)return alert('Enter a valid amount');x.price=n}
if(type==='fixed'){let x=state.fixed.find(x=>x.id===id);let value=$('f_price').value.trim()===''?null:Number($('f_price').value);if(x){if(value!=null&&(value<0||!Number.isFinite(value)))return alert('Enter a valid amount');x.price=value;x.currency=$('f_currency').value;x.known=value!=null}}
if(type==='spend'){let value=Number($('s_price').value);if(!Number.isFinite(value)||value<0||$('s_price').value.trim()==='')return alert('Enter a valid amount');let x=state.spends.find(x=>x.id===id),up={title:$('s_title').value.trim()||'Expense',date:$('s_date').value,price:value,currency:$('s_currency').value,category:$('s_category').value};if(x)Object.assign(x,up);else state.spends.push({id:uid(),...up})}
if(type==='wish'){let up={title:$('w_title').value.trim(),type:$('w_type').value,notes:$('w_notes').value};if(!up.title)return alert('Enter an item');let x=state.wishlist.find(x=>x.id===id);if(x)Object.assign(x,up);else state.wishlist.push({id:uid(),done:false,...up})}
closeDialog();save();render();toast('Saved')}
function addEvent(ref,mode,d){if(!cat(ref)||!state.plans[mode]?.[d])return;if(eventRows(mode,d).some(e=>e.ref===ref)){toast('Already scheduled on that day — nothing added twice');return}let a=cat(ref);state.plans[mode][d].push({id:uid(),ref,time:a.time||'',status:'planned',note:''});save();render();toast('Added '+a.title+' to '+dateLabel(d)+' '+(mode==='A'?'Plan A':'Rainy'))}
function dayPicker(ref,bundleMode=null){let a=cat(ref);if(!a)return;showDialog('Add '+a.title,'Choose the date and which itinerary to put this activity in.',`<div class="form-grid">${selectField('pick_date','Travel day',DATES.map(d=>[d,dateLabel(d)]),day)}${selectField('pick_mode','Itinerary',[['A','☀️ Plan A'],['rain','🌧 Rainy day']],bundleMode||'A')}</div>`,`<button class="btn" data-close="1">Cancel</button><button class="btn primary" data-modal-add="${esc(ref)}">Add to day</button>`) }
function addBundle(region,mode){let parts=state.catalog.filter(a=>a.region===region&&a.category!=='Rest');showDialog('Add regional activity group','This copies a set of options to the chosen day. After adding, remove those that are too much for one day; prices are counted for every added item.',`<div class="form-grid">${selectField('bundle_date','Date',DATES.map(d=>[d,dateLabel(d)]),day)}${selectField('bundle_mode','Plan',[['A','Plan A'],['rain','Rainy-day plan']],mode)}</div><div class="micro" style="margin-top:12px">Included: ${parts.map(x=>esc(x.title)).join(' · ')}</div>`,`<button class="btn" data-close="1">Cancel</button><button class="btn primary" data-modal-bundle="${esc(region)}">Add ${parts.length} cards</button>`) }
